[project]
name = "reviewlens"
version = "0.1.0"
description = "Review-intelligence pipeline: sentiment, themes, aspects, trends."
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "pyyaml",
    "huggingface_hub",
    "scikit-learn",
    "langdetect",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
transformer = ["torch", "transformers"]
notebooks = ["ipykernel", "nbconvert", "nbformat"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "app"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E501", "E702"]
